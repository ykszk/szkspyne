<html lang="en">

<head>
    <meta charset="utf-8">
    <title>{{title}}</title>
    <style>
        body {
            background: black;
            color: white;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: start;
        }

        svg {
            max-height: 95%; /* not using vh to allow zooming*/
        }

        #controls {
            margin: 5em;
        }

        ul {
            list-style-type: none;
            padding: 0.5em;
        }
    </style>
    <script>
        function change_visibility(cb) {
            let svg_id = cb.id.substring(3);
            let visibility = cb.checked ? "visible" : "hidden";
            const elms = {{svg_container}}.getElementsByClassName(svg_id)
            for (elm of elms) {
                elm.style.visibility = visibility;
            }
        }

        function change_all(visibility) {
            let elms = document.querySelectorAll("input[type='checkbox']");
            console.log(visibility);
            for (elm of elms) {
                elm.checked = visibility == "visible";
                change_visibility(elm);
            }
        }
        function switch_layer(radio) {
            const elms = document.querySelectorAll("g.layer");
            const selected_value = radio.value;
            for (elm of elms) {
                if (elm.classList.contains(selected_value)) {
                    elm.style.display = "inline";
                } else {
                    elm.style.display = "none";
                }
            }
		}
    </script>
</head>

<body>
    <div id="image">
        {{svg}}
    </div>
    <div id="controls">
        <h2>Show / Hide</h2>
        <form>
            <ul>
                {{checkboxes}}
            </ul>
        </form>
        <button onclick="change_all('visible')">Show All</button>
        <button onclick="change_all('hidden')">Hide All</button>
    </div>
</body>

</html>
