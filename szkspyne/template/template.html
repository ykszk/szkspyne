<html lang="en">

<head>
    <meta charset="utf-8">
    <title>{{title}}</title>
    <style>
        body {
            background: black;
            color: white;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: start;
        }

        svg {
            max-height: 95vh;
        }

        #controls {
            margin: 5em;
        }

        ul {
            list-style-type: none;
            padding: 0.5em;
        }
    </style>
    <!-- <link rel="stylesheet" type="text/css" href="default.css"> -->
    <!-- <script type="text/javascript" src="main.js"></script> -->
    <script>
        function change_visibility(cb) {
            let svg_id = cb.id.substring(3);
            let visibility = cb.checked ? "visible" : "hidden";
            document.getElementById(svg_id).style.visibility = visibility;
        }

        function change_all(visibility) {
            let elms = document.getElementsByTagName('input');
            console.log(visibility);
            for (elm of elms) {
                elm.checked = visibility == "visible";
                change_visibility(elm);
            }
        }
    </script>
</head>

<body>
    <div id="image">
        {{svg}}
    </div>
    <div id="controls">
        <h2>Show / Hide</h2>
        <form>
            <ul>
                {{checkboxes}}
            </ul>
        </form>
        <button onclick="change_all('visible')">Show All</button>
        <button onclick="change_all('hidden')">Hide All</button>
    </div>
</body>

</html>
