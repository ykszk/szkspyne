sigmas = [
    10.0,
    5.0,
    0.1,
]

[fit]
lambda = 0.0001

[fit.adam]
learning_rate = 0.01
beta1 = 0.9
beta2 = 0.999
epsilon = 0.00000001

[stopper]
max_iterations = 100
all = false

[stopper.no_improvement]
