min_delta = 0.0
objective = "minimize"

[mode]
variance = 0.999999

[icp_init]
alpha = 1.0
beta = 1.0
lambda = 100
max_iter = 100
tol = 0.000001

[icp_init.mode_config]
variance = 0.999
