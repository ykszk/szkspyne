[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "szkspyne"
description = "My python package for spine AI"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
]

[dependency-groups]
dev = [
    "black==23.9.1",
    "isort==5.12.0",
    "pre-commit",
]

[tool.setuptools_scm]
version_file = "szkspyne/_version.py"

[tool.setuptools.packages.find]
include = ["szkspyne*"]

[tool.black]
line-length = 119
skip-string-normalization = true

[tool.isort]
profile = "black"
lines_after_imports = 2

[tool.doit]
backend = "sqlite3"
