[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "szkspyne"
description = "My python package for spine AI"
readme = "README.md"
requires-python = "==3.13.*"
dynamic = ["version"]
dependencies = [
    "segmentation_models_pytorch",
    "opencv-python",
    "pytorch_lightning",
    "pydicom",
    "albumentations",
    "pydantic",
    "onnx",
    "onnxscript",
    # evaluation
    "nbconvert",
    "jupytext",
    "ipython",
    "ipykernel",
    "seaborn",
    # utils
    "bs4",
    "logzero",
    "doit",
    "scikit-image",
    "scikit-learn",
    "zstandard>=0.25.0",
    "szkmipy",
    "torchinfo>=1.8.0",
    "wandb>=0.28.0",
    "python-gdcm>=3.2.6",
    "svgwrite>=1.4.3",
    "scikit-spatial>=9.0.1",
    "pyscol",
]

[dependency-groups]
dev = [
    "black==23.9.1",
    "isort==5.12.0",
    "pre-commit",
]

[tool.setuptools_scm]
version_file = "szkspyne/_version.py"

[tool.setuptools.packages.find]
include = ["szkspyne*"]

[tool.black]
line-length = 119
skip-string-normalization = true

[tool.isort]
profile = "black"
lines_after_imports = 2

[tool.doit]
backend = "sqlite3"

[tool.uv.sources]
szkmipy = { git = "https://github.com/ykszk/szkmipy.git" }
pyscol = { git = "https://github.com/ykszk/scolrs.git", subdirectory = "crates/pyscol" }
